name: survey-management

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: survey
      POSTGRES_PASSWORD: survey
      POSTGRES_DB: survey
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U survey -d survey']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

  # S3-compatible object storage for uploads and logos (SeaweedFS; MinIO's images are no longer
  # published). Local development only: no credentials are enforced.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data -volume.max=8
    ports:
      - '${S3_PORT:-8333}:8333'
    volumes:
      - s3data:/data

  # Malware scanning for uploads. Heavy (about 1 GB of RAM, a few minutes to download signatures
  # on first start), so it's opt-in: `docker compose --profile scan up -d` and MALWARE_SCANNER=clamav.
  clamav:
    image: clamav/clamav:stable
    profiles: ['scan']
    ports:
      - '${CLAMAV_PORT:-3310}:3310'

volumes:
  pgdata:
  s3data:
